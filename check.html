<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>דף בדיקה זמני | כושר ותזונה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main id="main">
      <h2>דף בדיקה זמני</h2>
      <p class="hint">הדף בודק שהאתר, הפונקציה ומסד הנתונים מחוברים. כניסה עם משתמש דמה בלבד.</p>

      <div id="message" role="status"></div>

      <form id="login-form" class="stack" novalidate>
        <div class="field">
          <label for="email">אימייל</label>
          <div class="input-wrap"><input id="email" type="email" autocomplete="off" required></div>
        </div>
        <div class="field">
          <label for="password">סיסמה</label>
          <div class="input-wrap"><input id="password" type="password" autocomplete="off" required></div>
        </div>
        <button class="btn btn-primary" type="submit">התחברות</button>
      </form>

      <section id="signed-in" class="stack" hidden>
        <p id="who"></p>
        <button id="check-btn" class="btn btn-primary" type="button">בדיקת הנתונים שלי</button>
        <button id="logout-btn" class="btn btn-outline" type="button">יציאה</button>
        <ul id="result" class="stack"></ul>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script type="module" src="js/pages/skeleton-check.js"></script>
</body>
</html>
